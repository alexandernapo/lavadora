const META_LEALTAD = 5;

/* ====== UTILIDADES ====== */
const uid = () => Math.random().toString(36).slice(2,9);
const money = (n) => "$" + (Number(n)||0).toFixed(2);
const tipoOf = (id) => TIPOS.find(t=>t.id===id) || TIPOS[1];
function waNumber(raw){ let n=(raw||"").replace(/\D/g,""); if(n.startsWith("593"))return n; if(n.startsWith("0"))return "593"+n.slice(1); if(n.length===9)return "593"+n; return n; }
const precioServicio = (s,mult) => Math.round(s.base*mult);
const premioListo = (v) => v>0 && v%META_LEALTAD===0;
const vehFromDb = (r) => ({ id:r.id, placa:r.placa, tipo:r.tipo, marca:r.marca, color:r.color, clienteId:r.cliente_id });
const vehToDb = (v) => ({ id:v.id, placa:v.placa, tipo:v.tipo, marca:v.marca, color:v.color, cliente_id:v.clienteId });
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function csv(rows){ if(!rows||!rows.length) return ""; const cols=Object.keys(rows[0]); const esc=(v)=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"'; return cols.join(",")+"\n"+rows.map(r=>cols.map(k=>esc(r[k])).join(",")).join("\n"); }
function descargar(nombre,contenido,tipo){ const blob=new Blob([contenido],{type:tipo}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
function bancoTexto(b){ if(!b||!b.numero) return ""; return `Banco ${b.banco||""} · ${b.tipo||"Cuenta"} ${b.numero} · ${b.titular||""}${b.cedula?" · CI/RUC "+b.cedula:""}`; }
function redUrl(tipo,val){ if(!val) return "#"; const v=String(val).trim(); if(/^https?:\/\//i.test(v)) return v; const h=v.replace(/^@/,""); if(tipo==="instagram") return "https://instagram.com/"+h; if(tipo==="facebook") return "https://facebook.com/"+h; if(tipo==="tiktok") return "https://tiktok.com/@"+h; return v; }
function lealtadCliente(c, orders, servicios){
  const cnt={}; const wc=waNumber(c.whatsapp);
  (orders||[]).forEach(o=>{
    const done=(o.pago&&o.pago.pagado)||o.estado==="entregado"; if(!done) return;
    const match=(wc && waNumber(o.whatsapp)===wc) || (c.nombre && (o.cliente||"").trim().toLowerCase()===c.nombre.trim().toLowerCase());
    if(!match) return;
    (o.servicios||[]).forEach(sid=>{ cnt[sid]=(cnt[sid]||0)+1; });
  });
  const porTipo=Object.keys(cnt).map(sid=>{ const s=(servicios||[]).find(x=>x.id===sid); const count=cnt[sid];
    return { id:sid, nombre:(s&&s.nombre)||sid, count, sellos:count%META_LEALTAD, gratis: count>0 && count%META_LEALTAD===0 }; }).sort((a,b)=>b.count-a.count);
  const total=Object.values(cnt).reduce((a,n)=>a+n,0);
  const gratis=porTipo.filter(t=>t.gratis).map(t=>t.nombre);
  return { porTipo, total, gratis };
}

/* ====== APP ====== */
function App({demoRole}={}){
  const [estado, setEstado] = useState("cargando"); // cargando | ok | error
  const [tab, setTab] = useState("inicio");
  const [role, setRole] = useState(()=>{ if(demoRole) return demoRole; try{ return localStorage.getItem("lav_role")||null; }catch(e){ return null; } });
  const login=(r)=>{ setRole(r); setTab("inicio"); try{ localStorage.setItem("lav_role",r); }catch(e){} };
  const logout=()=>{ setRole(null); setTab("inicio"); try{ localStorage.removeItem("lav_role"); }catch(e){} };
  const [licOpen,setLicOpen]=useState(false);
  const [dbErr,setDbErr]=useState("");
  const rep=(p)=>{ if(p&&p.then) p.then(r=>{ if(r&&r.error) setDbErr(r.error.message||JSON.stringify(r.error)); }).catch(e=>setDbErr(String(e))); return p; };
  const [orders, setOrders] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [vehiculos, setVehiculos] = useState([]);
  const [gastos, setGastos] = useState([]);
  const [productos, setProductos] = useState([]);
  const [ventas, setVentas] = useState([]);
  const [cfg, setCfg] = useState({ negocio:"Mi Lavadora", comisionPct:30, lavadores:["Carlos","Luis","Marco"], bahias:["Bahía 1","Bahía 2","Bahía 3"], servicios:SERVICIOS_SEED, turno:{abierto:false,apertura:0,hora:null}, licencia:{pin:"6276",dias:15,pinDueno:"1111",pinEmpleado:"2222"} });

  const reloadAll = async () => {
    const [c,v,o,cf,g,pr,ve] = await Promise.all([
      SB.from("clientes").select("*"),
      SB.from("vehiculos").select("*"),
      SB.from("orders").select("*").order("fecha",{ascending:false}),
      SB.from("config").select("*").eq("id",1).single(),
      SB.from("gastos").select("*").order("fecha",{ascending:false}),
      SB.from("productos").select("*").order("nombre",{ascending:true}),
      SB.from("ventas").select("*").order("fecha",{ascending:false}),
    ]);
    setClientes(c.data||[]);
    setVehiculos((v.data||[]).map(vehFromDb));
    const norm=(x)=>({...x, estado:(NORM_ESTADO[x.estado]||x.estado)});
    setOrders((o.data||[]).map(norm));
    setGastos(g.data||[]);
    setProductos(pr.data||[]);
    setVentas(ve.data||[]);
    if(cf.data) setCfg({ negocio:cf.data.negocio||"Mi Lavadora", comisionPct:cf.data.comision_pct??30,
      lavadores:cf.data.lavadores||["Carlos","Luis","Marco"], bahias:cf.data.bahias||["Bahía 1","Bahía 2","Bahía 3"],
      servicios:cf.data.servicios||SERVICIOS_SEED, turno:cf.data.turno||{abierto:false,apertura:0,hora:null}, licencia:{pin:"6276",dias:15,pinDueno:"1111",pinEmpleado:"2222",...(cf.data.licencia||{})} });
  };

  useEffect(() => {
    (async () => {
      try {
        // sembrar datos de ejemplo si está vacío
        const { error:ce } = await SB.from("clientes").select("id").limit(1);
        if(ce) setDbErr("Lectura: "+ce.message);
        // asegurar servicios en config
        const cf = await SB.from("config").select("servicios").eq("id",1).single();
        if(cf.data && !cf.data.servicios){ await SB.from("config").update({servicios:SERVICIOS_SEED}).eq("id",1); }
        // asegurar licencia (arranca en 15 días)
        const lc = await SB.from("config").select("licencia").eq("id",1).single();
        if(!lc.data || !lc.data.licencia || !lc.data.licencia.vencimiento){
          const lic = { vencimiento: Date.now()+15*86400000, pin:"6276", dias:15, contacto:{nombre:"",whatsapp:""} };
          await SB.from("config").update({licencia:lic}).eq("id",1);
        }
        await reloadAll();
        setEstado("ok");
      } catch(e){ console.error(e); setEstado("error"); }
    })();
    const recargar = debounce(()=>reloadAll(), 350);
    const ch = SB.channel("rt").on("postgres_changes",{event:"*",schema:"public"}, recargar).subscribe();
    return () => { SB.removeChannel(ch); };
  }, []);

  const saveCfg = useRef(debounce(async (row) => {
    await SB.from("config").update({ negocio:row.negocio, comision_pct:row.comisionPct, lavadores:row.lavadores,
      bahias:row.bahias, servicios:row.servicios, turno:row.turno, licencia:row.licencia }).eq("id",1);
  }, 500)).current;
  const updateCfg = (patch) => setCfg(prev => { const next={...prev,...patch}; saveCfg(next); return next; });

  const tipoMult = (tid) => tipoOf(tid).mult;
  const totalOrden = (o) => { if(o.pago&&o.pago.pagado) return Number(o.pago.monto)||0; return (o.servicios||[]).reduce((a,sid)=>{ const s=cfg.servicios.find(x=>x.id===sid); return a+(s?precioServicio(s,tipoMult(o.tipo)):0); },0); };

  const updOrder = (id,patch) => { setOrders(p=>p.map(o=>o.id===id?{...o,...patch}:o)); rep(SB.from("orders").update(patch).eq("id",id)); };
  const delOrder = (id) => { setOrders(p=>p.filter(o=>o.id!==id)); rep(SB.from("orders").delete().eq("id",id)); };
  const updCliente = (id,patch) => { setClientes(p=>p.map(c=>c.id===id?{...c,...patch}:c)); rep(SB.from("clientes").update(patch).eq("id",id)); };
  const delCliente = (id) => { setClientes(p=>p.filter(c=>c.id!==id)); setVehiculos(p=>p.filter(v=>v.clienteId!==id)); rep(SB.from("clientes").delete().eq("id",id)); rep(SB.from("vehiculos").delete().eq("cliente_id",id)); };
  const addGasto = (monto,motivo) => { const gm={id:uid(),monto:Number(monto)||0,motivo:(motivo||"").trim(),fecha:Date.now()}; setGastos(p=>[gm,...p]); rep(SB.from("gastos").insert(gm)); };
  const delGasto = (id) => { setGastos(p=>p.filter(x=>x.id!==id)); rep(SB.from("gastos").delete().eq("id",id)); };
  const addProducto = (nombre,precio,stock,stockMin) => { const p={id:uid(),nombre:(nombre||"").trim(),precio:Number(precio)||0,stock:Number(stock)||0,stock_min:Number(stockMin)||3,fecha:Date.now()}; setProductos(prev=>[...prev,p]); rep(SB.from("productos").insert(p)); };
  const updProducto = (id,patch) => { setProductos(prev=>prev.map(p=>p.id===id?{...p,...patch}:p)); rep(SB.from("productos").update(patch).eq("id",id)); };
  const delProducto = (id) => { setProductos(prev=>prev.filter(p=>p.id!==id)); rep(SB.from("productos").delete().eq("id",id)); };
  const venderProducto = (p,cantidad) => { const qty=Math.max(1,Number(cantidad)||1); if(qty>(p.stock||0)) return; const total=qty*(Number(p.precio)||0); const venta={id:uid(),producto_id:p.id,nombre:p.nombre,cantidad:qty,precio_unit:p.precio,total,fecha:Date.now()}; setVentas(prev=>[venta,...prev]); rep(SB.from("ventas").insert(venta)); updProducto(p.id,{stock:(p.stock||0)-qty}); };
  const resetDatos = () => { setClientes([]); setVehiculos([]); setOrders([]); setGastos([]); setProductos([]); setVentas([]); rep(SB.from("clientes").delete().neq("id","")); rep(SB.from("vehiculos").delete().neq("id","")); rep(SB.from("orders").delete().neq("id","")); rep(SB.from("gastos").delete().neq("id","")); rep(SB.from("productos").delete().neq("id","")); rep(SB.from("ventas").delete().neq("id","")); };

  const ingresar = (o) => {
    const placa=o.placa.toUpperCase().trim(), phone=(o.whatsapp||"").trim(), name=(o.cliente||"").trim();
    const order={ id:uid(), placa, tipo:o.tipo, marca:o.marca, color:o.color, cliente:name, whatsapp:phone,
      servicios:o.servicios, bahia:o.bahia, lavador:o.lavador, estado:"espera", danos:o.danos, objetos:o.objetos,
      notas:o.notas, pago:{metodo:"Efectivo",monto:0,pagado:false}, fecha:(o.fecha?new Date(o.fecha+"T12:00:00").getTime():Date.now()) };
    setOrders(p=>[order,...p]); rep(SB.from("orders").insert(order));

    let persona = (phone && clientes.find(c=>waNumber(c.whatsapp)&&waNumber(c.whatsapp)===waNumber(phone)))
      || (name && clientes.find(c=>c.nombre.trim().toLowerCase()===name.toLowerCase()));
    let clienteId;
    if(persona){
      clienteId=persona.id;
      const upd={...persona, nombre:name||persona.nombre, whatsapp:phone||persona.whatsapp, visitas:(persona.visitas||0)+1, ultima:Date.now()};
      setClientes(clientes.map(c=>c.id===persona.id?upd:c)); rep(SB.from("clientes").upsert(upd));
    } else {
      clienteId=uid();
      const nuevo={id:clienteId, nombre:name, whatsapp:phone, visitas:1, ultima:Date.now()};
      setClientes([...clientes,nuevo]); rep(SB.from("clientes").insert(nuevo));
    }
    const ex = vehiculos.find(v=>v.placa===placa);
    const veh = ex ? {...ex, tipo:o.tipo, marca:o.marca||ex.marca, color:o.color||ex.color, clienteId}
                   : {id:uid(), placa, tipo:o.tipo, marca:o.marca, color:o.color, clienteId};
    setVehiculos(ex ? vehiculos.map(v=>v.id===ex.id?veh:v) : [...vehiculos,veh]);
    rep(SB.from("vehiculos").upsert(vehToDb(veh)));
    setTab("tablero");
  };

  if(estado==="cargando") return <SplashInicio negocio={cfg.negocio} />;
  if(estado==="error") return <Splash err msg="No se pudo conectar. Revisa el internet o las credenciales de Supabase." />;

  const lic = cfg.licencia||{}; const venc = lic.vencimiento||0;
  const diasRest = Math.ceil((venc-Date.now())/86400000);
  const expirado = venc>0 && Date.now()>venc;
  if(expirado) return <Bloqueo cfg={cfg} updateCfg={updateCfg} />;
  if(!role) return <Login cfg={cfg} onLogin={login} />;

  const PERMISOS={ dueno:["inicio","recepcion","tablero","caja","clientes","tienda","ajustes"], empleado:["inicio","recepcion","tablero"], desarrollador:["inicio","recepcion","tablero","caja","clientes","tienda","ajustes"] };
  const allowed = PERMISOS[role]||PERMISOS.dueno;
  const T = allowed.includes(tab)?tab:"inicio";
  const tabs=[
    {id:"recepcion",label:"Recepción",p:P.clip},{id:"tablero",label:"Tablero",p:P.grid},
    {id:"caja",label:"Caja",p:P.wallet},{id:"clientes",label:"Clientes",p:P.users},{id:"tienda",label:"Tienda",p:P.box},{id:"ajustes",label:"Ajustes",p:P.gear},
  ].filter(t=>allowed.includes(t.id));
  const activos = orders.filter(o=>o.estado!=="entregado").length;

  return (
    <div className="min-h-screen text-slate-800">
      <header className="lav-header text-white sticky top-0 z-20 shadow-lg overflow-hidden">
        {[12,40,66,82,55].map((l,i)=>(<span key={i} className="lav-bubble" style={{left:l+"%",width:8+i*3,height:8+i*3,animationDelay:i*1.1+"s"}}/>))}
        <div className="max-w-6xl mx-auto px-4 py-3.5 flex items-center gap-3 relative">
          <button onClick={()=>setTab("inicio")} className="flex items-center gap-3 flex-1 min-w-0 text-left lav-press">
            <div className="bg-white/20 p-1 rounded-2xl backdrop-blur overflow-hidden"><img src={LOGO_IMG} alt="logo" className="w-8 h-8 rounded-lg object-cover block"/></div>
            <div className="flex-1 min-w-0"><h1 className="font-extrabold text-xl leading-tight truncate">{cfg.negocio}</h1><p className="text-cyan-50 text-xs font-semibold">Lavado de vehículos · v3</p></div>
          </button>
          <button onClick={logout} className="lav-press text-white text-xs font-extrabold bg-white/20 px-3 py-1.5 rounded-full whitespace-nowrap">{role==="dueno"?"Propietario":role==="empleado"?"Empleado":"Desarrollador"} · Salir</button>
          {role==="desarrollador" && <button onClick={()=>setLicOpen(true)} aria-hidden="true" tabIndex={-1} className="lav-float-btn absolute right-2 bottom-1 w-7 h-7 rounded-full bg-white/40"></button>}
        </div>
      </header>
      {T!=="inicio" && <nav className="bg-white/80 backdrop-blur border-b border-blue-100 sticky top-[68px] z-10">
        <div className="max-w-6xl mx-auto px-2 py-2 flex gap-1">
          {tabs.map(t=>{ const on=T===t.id;
            return (<button key={t.id} onClick={()=>setTab(t.id)} className={"lav-press flex-1 flex flex-col items-center justify-center gap-1 py-2 px-0.5 rounded-xl text-[11px] sm:text-sm font-bold transition-colors "+(on?"bg-gradient-to-br from-cyan-500 to-blue-600 text-white shadow":"text-slate-500")}>
              <Ic p={t.p} size={18}/><span className="flex items-center gap-1">{t.label}{t.id==="tablero"&&activos>0&&<span className={"text-[10px] rounded-full px-1 min-w-[16px] text-center "+(on?"bg-white/25":"bg-blue-600 text-white")}>{activos}</span>}</span>
            </button>); })}
        </div>
      </nav>}
      <main className="max-w-6xl mx-auto p-4">
        {dbErr && <div className="bg-rose-50 border-2 border-rose-200 rounded-xl p-3 mb-4 text-xs font-bold text-rose-600">⚠ No se pudo guardar/leer en la base: {dbErr} <button onClick={()=>setDbErr("")} className="underline ml-1">ocultar</button></div>}
        {venc>0 && !expirado && diasRest<=5 && <Aviso dias={diasRest} lic={lic} negocio={cfg.negocio} />}
        {T==="inicio" && <Inicio setTab={setTab} cfg={cfg} orders={orders} totalOrden={totalOrden} allowed={allowed} />}
        {T==="recepcion" && <Recepcion cfg={cfg} clientes={clientes} vehiculos={vehiculos} tipoMult={tipoMult} onAdd={ingresar} />}
        {T==="tablero" && <Tablero orders={orders} totalOrden={totalOrden} cfg={cfg} role={role} onUpd={updOrder} onDel={delOrder} />}
        {T==="caja" && <Caja orders={orders} totalOrden={totalOrden} cfg={cfg} gastos={gastos} ventas={ventas} onAddGasto={addGasto} onDelGasto={delGasto} />}
        {T==="clientes" && <Clientes clientes={clientes} vehiculos={vehiculos} orders={orders} cfg={cfg} onUpd={updCliente} onDel={delCliente} />}
        {T==="tienda" && <Tienda productos={productos} onAdd={addProducto} onUpd={updProducto} onDel={delProducto} onVender={venderProducto} />}
        {T==="ajustes" && <Ajustes cfg={cfg} updateCfg={updateCfg} clientes={clientes} vehiculos={vehiculos} orders={orders} totalOrden={totalOrden} onReset={resetDatos} />}
      </main>
      <div className="text-center text-[11px] text-slate-400 font-bold py-6">Conectado a: {SUPABASE_URL.replace("https://","").split(".")[0]} · v3</div>
      {licOpen && <LicenciaModal cfg={cfg} updateCfg={updateCfg} onClose={()=>setLicOpen(false)} />}
    </div>
  );
}

/* ====== UI REUTILIZABLE ====== */
function Field({label,children}){ return (<label className="block"><span className="text-xs font-bold text-slate-400">{label}</span>{children}</label>); }
function Sec({p,title,sub,children}){ return (<section className="bg-white rounded-2xl border border-blue-50 shadow-sm p-4"><h2 className="font-extrabold flex items-center gap-2 text-slate-700">{p&&<span className="bg-gradient-to-br from-cyan-400 to-blue-500 text-white p-1.5 rounded-lg"><Ic p={p} size={16}/></span>}{title}</h2>{sub&&<p className="text-xs text-slate-400 mt-0.5 mb-3 font-semibold">{sub}</p>}<div className={sub?"":"mt-3"}>{children}</div></section>); }
function Drop({children}){ return (<div className="absolute z-30 left-0 right-0 mt-1 bg-white rounded-xl border-2 border-blue-100 shadow-lg overflow-hidden">{children}</div>); }
function ListEditor({items,upd,ph,val,setVal}){ const inp="w-full rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-semibold outline-none focus:border-blue-500"; return (<><div className="space-y-2 mb-2">{items.map((it,i)=>(<div key={i} className="flex items-center gap-2"><span className="flex-1 text-sm font-semibold bg-blue-50/60 rounded-xl px-3 py-2.5 border-2 border-blue-50">{it}</span><button onClick={()=>upd(items.filter((_,j)=>j!==i))} className="lav-press text-slate-300 hover:text-rose-500"><Ic p={P.x} size={18}/></button></div>))}</div><div className="flex gap-2"><input className={inp} value={val} onChange={e=>setVal(e.target.value)} placeholder={ph}/><button onClick={()=>{ if(val.trim()){ upd([...items,val.trim()]); setVal(""); } }} className="lav-press bg-gradient-to-br from-cyan-500 to-blue-600 text-white px-4 rounded-xl"><Ic p={P.plus} size={18}/></button></div></>); }
function NuevoServicio({onAdd}){
  const [nombre,setNombre]=useState(""); const [precio,setPrecio]=useState(""); const [proc,setProc]=useState("rapido");
  const inp="w-full rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-semibold outline-none focus:border-blue-500";
  const agregar=()=>{ if(!nombre.trim()) return; const pr=PROCESOS.find(p=>p.id===proc); onAdd({ id:uid(), nombre:nombre.trim(), base:Number(precio)||0, etapas:pr.etapas }); setNombre(""); setPrecio(""); setProc("rapido"); };
  return (<div className="mt-4 pt-4 border-t-2 border-dashed border-blue-100 space-y-2">
    <p className="text-xs font-bold text-slate-400">Agregar nuevo servicio</p>
    <input className={inp} value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Ej: Pulido de motor"/>
    <div className="grid grid-cols-2 gap-2">
      <input type="number" className={inp} value={precio} onChange={e=>setPrecio(e.target.value)} placeholder="Precio $ (Auto/Sedán)"/>
      <select className={inp} value={proc} onChange={e=>setProc(e.target.value)}>{PROCESOS.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}</select>
    </div>
    <button onClick={agregar} className="lav-press w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold py-2.5 rounded-xl flex items-center justify-center gap-2"><Ic p={P.plus} size={18}/> Agregar servicio</button>
  </div>);
}

/* ====== LOGIN (ROLES) ====== */
function Login({cfg,onLogin}){
  const lic=cfg.licencia||{};
  const [pin,setPin]=useState(""); const [msg,setMsg]=useState("");
  const entrar=()=>{
    const p=(pin||"").trim();
    if(p && p===String(lic.pinDueno||"1111")) return onLogin("dueno");
    if(p && p===String(lic.pinEmpleado||"2222")) return onLogin("empleado");
    if(p && p===String(lic.pin||"6276")) return onLogin("desarrollador");
    setMsg("PIN incorrecto");
  };
  return (<div className="lav-bg min-h-screen flex items-center justify-center p-6">
    <div className="bg-white rounded-3xl shadow-xl border border-blue-50 w-full max-w-sm p-6">
      <div className="text-center mb-5"><span className="inline-flex bg-white p-1.5 rounded-2xl shadow mb-2 overflow-hidden"><img src={LOGO_IMG} alt="logo" className="w-16 h-16 rounded-xl object-cover block"/></span><h1 className="font-extrabold text-xl text-slate-800">{cfg.negocio||"Lavadora"}</h1><p className="text-sm text-slate-400 font-semibold">Ingresa tu PIN</p></div>
      <input value={pin} onChange={e=>{setPin(e.target.value);setMsg("");}} onKeyDown={e=>{if(e.key==="Enter")entrar();}} inputMode="numeric" type="password" placeholder="PIN" autoFocus className="w-full text-center text-3xl font-extrabold rounded-xl border-2 border-slate-200 py-3 outline-none focus:border-blue-500"/>
      {msg&&<p className="text-xs font-bold text-rose-500 mt-2 text-center">{msg}</p>}
      <button onClick={entrar} className="lav-press mt-3 w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold py-3.5 rounded-xl">Entrar</button>
    </div>
  </div>);
}

/* ====== INICIO (PORTADA) ====== */
function Inicio({ setTab, cfg, orders, totalOrden, allowed }){
  const startToday=new Date(new Date().setHours(0,0,0,0)).getTime();
  const hoy=orders.filter(o=>o.pago?.pagado && Number(o.fecha||0)>=startToday);
  const totalHoy=hoy.reduce((a,o)=>a+totalOrden(o),0);
  const activos=orders.filter(o=>o.estado!=="entregado").length;
  const items=[
    {id:"recepcion", p:P.clip, t:"Recepción", s:"Registrar ingreso", g:"from-cyan-500 to-blue-600"},
    {id:"tablero", p:P.grid, t:"Tablero", s:"Estados en vivo", g:"from-sky-500 to-cyan-500"},
    {id:"caja", p:P.wallet, t:"Caja", s:"Ingresos y comisiones", g:"from-blue-500 to-indigo-600"},
    {id:"clientes", p:P.users, t:"Clientes", s:"Frecuentes y lealtad", g:"from-violet-500 to-purple-600"},
    {id:"tienda", p:P.box, t:"Tienda", s:"Productos y stock", g:"from-teal-500 to-emerald-600"},
    {id:"ajustes", p:P.gear, t:"Ajustes", s:"Precios, lavadores, licencia", g:"from-slate-500 to-slate-700"},
  ].filter(it=>!allowed || allowed.includes(it.id));
  return (<div className="space-y-4">

/* ====== CAJA ====== */
function Caja({ orders, totalOrden, cfg, gastos, ventas, onAddGasto, onDelGasto }){
  const now=new Date();
  const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const dow=(now.getDay()+6)%7; // lunes = 0
  const startWeek=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow).getTime();
  const startMonth=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const pagados=orders.filter(o=>o.pago?.pagado);
  const rango=(from)=>pagados.filter(o=>Number(o.fecha||0)>=from);
  const sum=(arr)=>arr.reduce((a,o)=>a+totalOrden(o),0);
  const hoy=rango(startToday), semana=rango(startWeek), mes=rango(startMonth);
  const gRango=(from)=>gastos.filter(g=>Number(g.fecha||0)>=from);
  const gSum=(arr)=>arr.reduce((a,g)=>a+(Number(g.monto)||0),0);
  const gHoy=gRango(startToday); const gastoHoy=gSum(gHoy);
  const vRango=(from)=>(ventas||[]).filter(v=>Number(v.fecha||0)>=from);
  const vSum=(arr)=>arr.reduce((a,v)=>a+(Number(v.total)||0),0);
  const ventasHoy=vSum(vRango(startToday)); const ventasSemana=vSum(vRango(startWeek)); const ventasMes=vSum(vRango(startMonth));
  const ingresosHoy=sum(hoy)+ventasHoy, ingresosSemana=sum(semana)+ventasSemana, ingresosMes=sum(mes)+ventasMes;
  const porMetodo=METODOS.map(m=>({m,total:hoy.filter(o=>o.pago.metodo===m).reduce((a,o)=>a+totalOrden(o),0)})).filter(x=>x.total>0);
  const comis={}; hoy.forEach(o=>{ comis[o.lavador]=(comis[o.lavador]||0)+totalOrden(o)*(cfg.comisionPct/100); });
  const [monto,setMonto]=useState(""); const [motivo,setMotivo]=useState("");
  const agregar=()=>{ if(!(Number(monto)>0)) return; onAddGasto(monto,motivo); setMonto(""); setMotivo(""); };
  const [movOpen,setMovOpen]=useState(false); const [mesSel,setMesSel]=useState(new Date().toISOString().slice(0,7));
  const movs=[]; pagados.forEach(o=>movs.push({fecha:Number(o.fecha||0),tipo:"ingreso",concepto:(o.placa+" · "+(o.cliente||"")),monto:totalOrden(o),metodo:o.pago.metodo})); (gastos||[]).forEach(g=>movs.push({fecha:Number(g.fecha||0),tipo:"salida",concepto:(g.motivo||"Gasto"),monto:Number(g.monto)||0,metodo:""})); (ventas||[]).forEach(v=>movs.push({fecha:Number(v.fecha||0),tipo:"ingreso",concepto:("Venta: "+v.nombre+" x"+v.cantidad),monto:Number(v.total)||0,metodo:"Tienda"})); movs.sort((a,b)=>b.fecha-a.fecha);
  const fmtMov=(ms)=>new Date(ms).toLocaleDateString('es-EC',{day:'2-digit',month:'2-digit'})+" "+new Date(ms).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
  const movMes=movs.filter(m=>m.fecha>=startMonth).map(m=>({...m,fechaTxt:fmtMov(m.fecha)}));
  const descargarMes=()=>{ if(!mesSel) return; const p=mesSel.split("-"); const y=Number(p[0]),mo=Number(p[1]); const from=new Date(y,mo-1,1).getTime(),to=new Date(y,mo,1).getTime(); const rows=movs.filter(m=>m.fecha>=from&&m.fecha<to).sort((a,b)=>a.fecha-b.fecha).map(m=>({fecha:new Date(m.fecha).toLocaleString('es-EC'),tipo:m.tipo==="ingreso"?"Ingreso":"Salida",concepto:m.concepto,monto:(m.tipo==="ingreso"?"+":"-")+(Number(m.monto)||0).toFixed(2),metodo:m.metodo})); descargar("movimientos-"+mesSel+".csv", csv(rows), "text/csv;charset=utf-8"); };

  return (<div className="space-y-4">
    <div className="rounded-2xl p-5 shadow-sm bg-gradient-to-br from-cyan-500 to-blue-600 text-white">
      <p className="text-xs font-bold text-cyan-50">Ingresos de hoy</p>
      <p className="font-extrabold text-4xl mt-1">{money(ingresosHoy)}</p>
      <p className="text-xs font-bold text-cyan-50 mt-1">{hoy.length} vehículo{hoy.length!==1?"s":""} cobrado{hoy.length!==1?"s":""}{ventasHoy>0?` · ${money(ventasHoy)} en tienda`:""}</p>
    </div>
    <div className="grid grid-cols-2 gap-3">
      <Stat label="Gastos de hoy" value={money(gastoHoy)} sub={`${gHoy.length} registro${gHoy.length!==1?"s":""}`}/>
      <Stat label="Neto de hoy" value={money(ingresosHoy-gastoHoy)} grad/>
    </div>
    <div className="grid grid-cols-2 gap-3">
      <Stat label="Neto semana" value={money(ingresosSemana-gSum(gRango(startWeek)))} sub={`ingresos ${money(ingresosSemana)}`}/>
      <Stat label="Neto mes" value={money(ingresosMes-gSum(gRango(startMonth)))} sub={`ingresos ${money(ingresosMes)}`}/>

    <section className="bg-white rounded-2xl border border-blue-50 shadow-sm p-4">

        <input value={monto} onChange={e=>setMonto(e.target.value)} inputMode="decimal" placeholder="$ Monto" className="w-28 rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-bold outline-none focus:border-blue-500"/>
        <input value={motivo} onChange={e=>setMotivo(e.target.value)} placeholder="Motivo (ej. shampoo)" className="flex-1 rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-semibold outline-none focus:border-blue-500"/>
        <button onClick={agregar} className="lav-press bg-gradient-to-br from-cyan-500 to-blue-600 text-white px-4 rounded-xl font-extrabold"><Ic p={P.plus} size={18}/></button>
      </div>
      {gHoy.length>0 && (<div className="mt-3 space-y-2">{gHoy.map(g=>(<div key={g.id} className="flex items-center gap-2 text-sm"><span className="flex-1 text-slate-600 font-semibold truncate">{g.motivo||"Gasto"}</span><span className="font-extrabold text-rose-500">-{money(g.monto)}</span><button onClick={()=>onDelGasto(g.id)} className="lav-press text-slate-300 hover:text-rose-500"><Ic p={P.trash} size={15}/></button></div>))}</div>)}
    </section>

    <section className="bg-white rounded-2xl border border-blue-50 shadow-sm p-4">
      <button onClick={()=>setMovOpen(o=>!o)} className="w-full flex items-center justify-between">

        <span className="text-slate-400 text-lg">{movOpen?"▲":"▼"}</span>
      </button>
      {movOpen && (movMes.length===0 ? <p className="text-sm text-slate-400 font-semibold mt-3">Sin movimientos este mes.</p> :
        <div className="mt-3 space-y-1.5 max-h-72 overflow-y-auto">
          {movMes.map((m,i)=>(<div key={i} className="flex items-center gap-2 text-sm border-b border-slate-50 pb-1.5">
            <span className={"w-1.5 h-8 rounded-full shrink-0 "+(m.tipo==="ingreso"?"bg-emerald-400":"bg-rose-400")}/>
            <div className="flex-1 min-w-0"><p className="font-bold text-slate-600 truncate">{m.concepto}</p><p className="text-[11px] text-slate-400 font-semibold">{m.fechaTxt}{m.metodo?" · "+m.metodo:""}</p></div>
            <span className={"font-extrabold whitespace-nowrap "+(m.tipo==="ingreso"?"text-emerald-600":"text-rose-500")}>{m.tipo==="ingreso"?"+":"-"}{money(m.monto)}</span>
          </div>))}
        </div>)}
      <div className="mt-3 pt-3 border-t border-slate-100">
        <p className="text-xs font-bold text-slate-400 mb-2">Descargar otro mes (CSV)</p>
        <div className="flex gap-2">
          <input type="month" value={mesSel} onChange={e=>setMesSel(e.target.value)} className="flex-1 rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-semibold outline-none focus:border-blue-500"/>
          <button onClick={descargarMes} className="lav-press bg-gradient-to-br from-cyan-500 to-blue-600 text-white px-4 rounded-xl font-extrabold text-sm">Descargar</button>
        </div>
      </div>
    </section>
    <section className="bg-white rounded-2xl border border-blue-50 shadow-sm p-4"><h2 className="font-extrabold mb-3 text-slate-700">Métodos de pago (hoy)</h2>{porMetodo.length===0?<p className="text-sm text-slate-400 font-semibold">Aún no hay cobros hoy.</p>:<div className="space-y-2.5">{porMetodo.map(x=>(<div key={x.m} className="flex justify-between items-center text-sm"><span className="text-slate-500 font-semibold">{x.m}</span><span className="font-extrabold text-slate-700">{money(x.total)}</span></div>))}</div>}</section>
    <section className="bg-white rounded-2xl border border-blue-50 shadow-sm p-4"><h2 className="font-extrabold mb-3 text-slate-700">Comisiones de hoy ({cfg.comisionPct}%)</h2>{Object.keys(comis).length===0?<p className="text-sm text-slate-400 font-semibold">Sin datos.</p>:<div className="space-y-2.5">{Object.entries(comis).map(([l,c])=>(<div key={l} className="flex justify-between items-center text-sm"><span className="text-slate-500 font-semibold flex items-center gap-1.5"><span className="bg-slate-100 p-1 rounded-lg"><Ic p={P.user} size={13}/></span>{l}</span><span className="font-extrabold text-emerald-600">{money(c)}</span></div>))}</div>}</section>
    <p className="text-xs text-slate-400 font-semibold text-center">Los cobros se registran con el botón <b>Cobrar</b> del Tablero.</p>
  </div>);
}
function Stat({label,value,big,grad,sub}){ return (<div className={"rounded-2xl p-3.5 shadow-sm "+(grad?"bg-gradient-to-br from-cyan-500 to-blue-600 text-white":"bg-white border border-blue-50")}><p className={"text-xs font-bold "+(grad?"text-cyan-50":"text-slate-400")}>{label}</p><p className={"font-extrabold "+(big?"text-2xl":"text-xl")+(grad?"":" text-slate-800")}>{value}</p>{sub&&<p className={"text-[11px] font-bold mt-0.5 "+(grad?"text-cyan-50":"text-slate-400")}>{sub}</p>}</div>); }

/* ====== CLIENTES ====== */
function Clientes({ clientes, vehiculos, orders, cfg, onUpd, onDel }){
  const [soloFrec,setSoloFrec]=useState(false);
  let list=[...clientes].sort((a,b)=>(b.visitas||0)-(a.visitas||0));
  if(soloFrec) list=list.filter(c=>(c.visitas||0)>=META_LEALTAD);
  if(clientes.length===0) return <Empty p={P.users} title="Sin clientes aún" msg="Se registran solos al ingresar vehículos." />;
  return (<div className="space-y-3">
    <div className="flex items-center gap-2"><button onClick={()=>setSoloFrec(false)} className={"lav-press flex-1 py-2 rounded-xl text-sm font-extrabold "+(!soloFrec?"bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow":"bg-white border border-blue-50 text-slate-500")}>Todos ({clientes.length})</button><button onClick={()=>setSoloFrec(true)} className={"lav-press flex-1 py-2 rounded-xl text-sm font-extrabold flex items-center justify-center gap-1 "+(soloFrec?"bg-gradient-to-r from-amber-400 to-orange-500 text-white shadow":"bg-white border border-blue-50 text-slate-500")}><Ic p={P.star} size={15}/> Frecuentes</button></div>
    {list.map(c=><ClienteCard key={c.id} c={c} vehiculos={vehiculos} orders={orders} cfg={cfg} onUpd={onUpd} onDel={onDel} />)}
  </div>);
}

function ClienteCard({ c, vehiculos, orders, cfg, onUpd, onDel }){
  const [edit,setEdit]=useState(false); const [del,setDel]=useState(false);
  const [f,setF]=useState({nombre:c.nombre||"", whatsapp:c.whatsapp||"", visitas:c.visitas||0});
  const misVeh=vehiculos.filter(v=>v.clienteId===c.id);
  const L=lealtadCliente(c,orders,cfg.servicios);
  const gratisTxt=L.gratis.length?`¡Tienes lavado GRATIS disponible en: ${L.gratis.join(", ")}! 🎁`:"Junta 5 del mismo tipo y el siguiente es gratis.";
  const promo=encodeURIComponent(`Hola ${c.nombre||""}! 🚗💦 En ${cfg.negocio} valoramos tu preferencia (${L.total} lavados). ${gratisTxt} ¡Te esperamos!`);
  const wa=`https://wa.me/${waNumber(c.whatsapp)}?text=${promo}`;
  const inp="w-full rounded-xl border-2 border-slate-200 px-3 py-2 text-sm font-semibold outline-none focus:border-blue-500";
  const guardar=()=>{ onUpd(c.id,{nombre:f.nombre.trim(), whatsapp:f.whatsapp.trim(), visitas:Number(f.visitas)||0}); setEdit(false); };
  return (<div className="bg-white rounded-2xl border border-blue-50 shadow-sm p-3.5 relative">
    <div className="flex items-center gap-3"><span className="bg-gradient-to-br from-cyan-400 to-blue-500 text-white p-2.5 rounded-xl"><Ic p={P.user} size={20}/></span><div className="flex-1 min-w-0"><p className="font-extrabold text-slate-700 truncate flex items-center gap-1.5">{c.nombre||"—"}{L.total>=META_LEALTAD&&<Ic p={P.star} size={14} fill="#fbbf24" className="text-amber-400"/>}</p><p className="text-xs text-slate-400 font-bold">{c.whatsapp||"sin WhatsApp"}</p></div><div className="text-right"><p className="text-2xl font-extrabold text-blue-600 leading-none">{L.total}</p><p className="text-[10px] font-bold text-slate-400">lavados</p></div></div>
    {misVeh.length>0&&(<div className="flex flex-wrap gap-1.5 mt-2.5">{misVeh.map(v=>{ const T=tipoOf(v.tipo); return (<span key={v.id} className="flex items-center gap-1 bg-slate-50 border border-slate-100 rounded-lg px-2 py-1 text-xs font-bold text-slate-500"><Ic p={T.pth} size={12} className="text-slate-400"/><span className="font-mono">{v.placa}</span></span>); })}</div>)}
    {L.gratis.length>0 && <p className="text-xs font-extrabold text-emerald-600 mt-2.5 flex items-center gap-1"><Ic p={P.gift} size={13}/> Gratis: {L.gratis.join(", ")}</p>}
    {L.porTipo.length===0 ? <p className="text-xs text-slate-400 font-semibold mt-2.5">Aún sin lavados registrados.</p> : (
      <div className="mt-2.5 space-y-2">
        {L.porTipo.map(t=>(<div key={t.id}>
          <div className="flex items-center justify-between text-xs font-bold">
            <span className="text-slate-600 truncate mr-2">{t.nombre}</span>
            {t.gratis ? <span className="text-emerald-600 whitespace-nowrap flex items-center gap-1"><Ic p={P.gift} size={11}/> ¡Gratis!</span> : <span className="text-slate-400 whitespace-nowrap">{t.count} · faltan {META_LEALTAD-t.sellos}</span>}
          </div>
          <div className="flex items-center gap-1 mt-1">{Array.from({length:META_LEALTAD}).map((_,i)=>(<span key={i} className={"flex-1 h-1.5 rounded-full "+(i<(t.gratis?META_LEALTAD:t.sellos)?"bg-gradient-to-r from-cyan-400 to-blue-500":"bg-slate-100")}/>))}</div>
        </div>))}
      </div>
    )}
    <div className="grid grid-cols-3 gap-1.5 mt-3">
      <a href={wa} target="_blank" rel="noreferrer" className="lav-press bg-emerald-50 text-emerald-600 border-2 border-emerald-100 text-xs font-extrabold py-2 rounded-xl flex items-center justify-center gap-1"><Ic p={P.msg} size={14}/> Promo</a>
      <button onClick={()=>{ setF({nombre:c.nombre||"",whatsapp:c.whatsapp||"",visitas:c.visitas||0}); setEdit(v=>!v); }} className="lav-press bg-blue-50 text-blue-600 border-2 border-blue-100 text-xs font-extrabold py-2 rounded-xl flex items-center justify-center gap-1"><Ic p={P.pen} size={14}/> Editar</button>
      <button onClick={()=>setDel(true)} className="lav-press bg-rose-50 text-rose-500 border-2 border-rose-100 text-xs font-extrabold py-2 rounded-xl flex items-center justify-center gap-1"><Ic p={P.trash} size={14}/> Borrar</button>
    </div>
    {edit&&(<div className="mt-3 space-y-2 lav-pop border-t-2 border-dashed border-blue-100 pt-3">
      <div className="grid grid-cols-2 gap-2">
        <label className="block"><span className="text-xs font-bold text-slate-400">Nombre</span><input className={inp+" mt-1"} value={f.nombre} onChange={e=>setF({...f,nombre:e.target.value})}/></label>
        <label className="block"><span className="text-xs font-bold text-slate-400">WhatsApp</span><input className={inp+" mt-1"} value={f.whatsapp} onChange={e=>setF({...f,whatsapp:e.target.value})} inputMode="tel"/></label>
      </div>
      <label className="block"><span className="text-xs font-bold text-slate-400">Visitas (lavados acumulados)</span><input type="number" className={inp+" mt-1"} value={f.visitas} onChange={e=>setF({...f,visitas:e.target.value})}/></label>
      <div className="flex gap-2"><button onClick={()=>setEdit(false)} className="lav-press flex-1 py-2 rounded-xl border-2 border-slate-200 font-bold text-slate-500 text-sm">Cancelar</button><button onClick={guardar} className="lav-press flex-1 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold text-sm">Guardar</button></div>
    </div>)}
    {del&&(<div className="absolute inset-0 bg-white/95 rounded-2xl flex flex-col items-center justify-center gap-2 p-4 lav-pop"><p className="text-sm font-extrabold text-slate-700 text-center">¿Borrar a {c.nombre||"este cliente"}?</p><p className="text-xs text-slate-400 font-semibold text-center">Se quitará el cliente y sus vehículos.</p><div className="flex gap-2 w-full"><button onClick={()=>setDel(false)} className="lav-press flex-1 py-2 rounded-lg border-2 border-slate-200 font-bold text-slate-500 text-sm">No</button><button onClick={()=>onDel(c.id)} className="lav-press flex-1 py-2 rounded-lg bg-rose-500 text-white font-bold text-sm">Sí, borrar</button></div></div>)}
  </div>);
}

/* ====== TIENDA (productos e inventario) ====== */
function Tienda({ productos, onAdd, onUpd, onDel, onVender }){
  const bajos=(productos||[]).filter(p=>(p.stock||0)<=(p.stock_min||3));
  return (<div className="space-y-4 max-w-2xl mx-auto">
    {bajos.length>0 && (<div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 flex items-start gap-2">
      <span className="bg-amber-100 text-amber-600 p-2 rounded-xl shrink-0"><Ic p={P.alert} size={18}/></span>
      <div><p className="text-sm font-extrabold text-amber-700">Se está agotando el stock</p><p className="text-xs font-semibold text-amber-600">{bajos.map(p=>p.nombre).join(", ")}</p></div>
    </div>)}
    {(!productos||productos.length===0) ? <Empty p={P.box} title="Sin productos aún" msg="Agrega tu primer producto abajo." /> :
      <div className="space-y-2.5">{productos.map(p=><ProductoCard key={p.id} p={p} onUpd={onUpd} onDel={onDel} onVender={onVender}/>)}</div>}
    <NuevoProducto onAdd={onAdd}/>
  </div>);
}

function ProductoCard({ p, onUpd, onDel, onVender }){
  const [qty,setQty]=useState(1); const [editStock,setEditStock]=useState(false); const [nuevoStock,setNuevoStock]=useState(p.stock);
  const [del,setDel]=useState(false);
  const bajo=(p.stock||0)<=(p.stock_min||3);
  return (<div className="bg-white rounded-2xl border border-blue-50 shadow-sm p-3.5 relative">
    <div className="flex items-center gap-3">
      <span className={"p-2.5 rounded-xl "+(bajo?"bg-amber-100 text-amber-600":"bg-blue-100 text-blue-600")}><Ic p={P.box} size={20}/></span>
      <div className="flex-1 min-w-0"><p className="font-extrabold text-slate-700 truncate">{p.nombre}</p><p className="text-xs text-slate-400 font-bold">{money(p.precio)} c/u</p></div>
      <div className="text-right"><p className={"text-xl font-extrabold leading-none "+(bajo?"text-amber-600":"text-blue-600")}>{p.stock}</p><p className="text-[10px] font-bold text-slate-400">en stock</p></div>
      <button onClick={()=>setDel(true)} className="text-slate-200 hover:text-rose-500 lav-press"><Ic p={P.trash} size={15}/></button>
    </div>
    {bajo && <p className="text-xs font-bold text-amber-600 mt-1.5 flex items-center gap-1"><Ic p={P.alert} size={12}/> Se está agotando</p>}
    <div className="flex items-center gap-2 mt-3">
      <input type="number" min="1" value={qty} onChange={e=>setQty(e.target.value)} className="w-16 rounded-lg border-2 border-slate-200 px-2 py-1.5 text-sm font-bold text-center outline-none focus:border-blue-500"/>
      <button onClick={()=>onVender(p,qty)} disabled={(p.stock||0)<=0} className="lav-press flex-1 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold text-sm disabled:opacity-40">Vender</button>
      <button onClick={()=>{setEditStock(v=>!v);setNuevoStock(p.stock);}} className="lav-press px-3 py-2 rounded-xl border-2 border-slate-200 text-slate-500 font-bold text-xs">Ajustar</button>
    </div>
    {editStock && (<div className="flex items-center gap-2 mt-2.5 bg-slate-50 rounded-xl p-2.5">
      <input type="number" value={nuevoStock} onChange={e=>setNuevoStock(e.target.value)} className="flex-1 rounded-lg border-2 border-slate-200 px-2 py-1.5 text-sm font-bold text-center outline-none focus:border-blue-500"/>
      <button onClick={()=>{onUpd(p.id,{stock:Number(nuevoStock)||0}); setEditStock(false);}} className="lav-press bg-blue-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs">Guardar</button>
    </div>)}
    {del && (<div className="absolute inset-0 bg-white/95 rounded-2xl flex flex-col items-center justify-center gap-2 p-3 lav-pop">
      <p className="text-sm font-extrabold text-slate-700 text-center">¿Eliminar {p.nombre}?</p>
      <div className="flex gap-2 w-full"><button onClick={()=>setDel(false)} className="lav-press flex-1 py-2 rounded-lg border-2 border-slate-200 font-bold text-slate-500 text-sm">No</button><button onClick={()=>onDel(p.id)} className="lav-press flex-1 py-2 rounded-lg bg-rose-500 text-white font-bold text-sm">Sí, eliminar</button></div>
    </div>)}
  </div>);
}

function NuevoProducto({onAdd}){
  const [nombre,setNombre]=useState(""); const [precio,setPrecio]=useState(""); const [stock,setStock]=useState(""); const [stockMin,setStockMin]=useState("3");
  const inp="w-full rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-semibold outline-none focus:border-blue-500";
  const agregar=()=>{ if(!nombre.trim()) return; onAdd(nombre,precio,stock,stockMin); setNombre(""); setPrecio(""); setStock(""); setStockMin("3"); };
  return (<section className="bg-white rounded-2xl border border-blue-50 shadow-sm p-4">
    <h2 className="font-extrabold mb-3 text-slate-700">Agregar producto</h2>
    <div className="space-y-2">
      <input className={inp} value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Ej: Aromatizante"/>
      <div className="grid grid-cols-3 gap-2">
        <input type="number" className={inp} value={precio} onChange={e=>setPrecio(e.target.value)} placeholder="Precio $"/>
        <input type="number" className={inp} value={stock} onChange={e=>setStock(e.target.value)} placeholder="Stock inicial"/>
        <input type="number" className={inp} value={stockMin} onChange={e=>setStockMin(e.target.value)} placeholder="Alerta en"/>
      </div>
    </div>
    <button onClick={agregar} className="lav-press mt-3 w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold py-2.5 rounded-xl flex items-center justify-center gap-2"><Ic p={P.plus} size={18}/> Agregar</button>
  </section>);
}

/* ====== AJUSTES ====== */
function Ajustes({ cfg, updateCfg, clientes, vehiculos, orders, totalOrden, onReset }){
  const [nl,setNl]=useState(""); const [nb,setNb]=useState("");
  const [rst,setRst]=useState(false); const [rstPin,setRstPin]=useState(""); const [rstMsg,setRstMsg]=useState(""); const [rstOk,setRstOk]=useState(false);
  const inp="w-full rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-semibold outline-none focus:border-blue-500";
  const b=(cfg.licencia&&cfg.licencia.banco)||{}; const setB=(k,v)=>updateCfg({licencia:{...(cfg.licencia||{}), banco:{...b,[k]:v}}});
  const [cd,setCd]=useState(String((cfg.licencia&&cfg.licencia.pinDueno)||"1111")); const [ce,setCe]=useState(String((cfg.licencia&&cfg.licencia.pinEmpleado)||"2222")); const [okClaves,setOkClaves]=useState(false);
  const guardarClaves=()=>{ updateCfg({licencia:{...(cfg.licencia||{}), pinDueno:(cd.trim()||"1111"), pinEmpleado:(ce.trim()||"2222")}}); setOkClaves(true); };
  const red=(cfg.licencia&&cfg.licencia.redes)||{}; const setRed=(k,v)=>updateCfg({licencia:{...(cfg.licencia||{}), redes:{...red,[k]:v}}});
  const jg=(cfg.licencia&&cfg.licencia.juego)||{}; const setJg=(k,v)=>updateCfg({licencia:{...(cfg.licencia||{}), juego:{...jg,[k]:v}}});
  const doReset=()=>{ const pd=String((cfg.licencia&&cfg.licencia.pinDueno)||"1111"); const pv=String((cfg.licencia&&cfg.licencia.pin)||"6276"); if(rstPin===pd||rstPin===pv){ onReset&&onReset(); setRstOk(true); setRst(false); setRstPin(""); setRstMsg(""); } else setRstMsg("PIN incorrecto"); };
  return (<div className="space-y-4">
    <Sec title="Negocio"><label className="block mb-3"><span className="text-xs font-bold text-slate-400">Nombre</span><input className={inp+" mt-1"} value={cfg.negocio} onChange={e=>updateCfg({negocio:e.target.value})}/></label><label className="block"><span className="text-xs font-bold text-slate-400">Comisión al lavador (%)</span><input className={inp+" mt-1"} type="number" value={cfg.comisionPct} onChange={e=>updateCfg({comisionPct:Number(e.target.value)||0})}/></label></Sec>
    <Sec title="Servicios">
      <p className="text-xs text-slate-400 mb-3 font-semibold">Precio para Auto/Sedán (los demás tamaños se calculan solos) y qué proceso de lavado sigue cada uno. Puedes agregar o quitar servicios cuando quieras.</p>
      <div className="space-y-2.5">
        {cfg.servicios.map(s=>(<div key={s.id} className="border-2 border-slate-100 rounded-xl p-2.5">

            <span className="flex-1 text-sm font-bold text-slate-600 truncate">{s.nombre}</span>
            <span className="text-slate-400 text-sm font-bold">$</span>
            <input type="number" value={s.base} className="w-20 rounded-lg border-2 border-slate-200 px-2 py-1.5 text-sm font-bold text-right outline-none focus:border-blue-500" onChange={e=>updateCfg({servicios:cfg.servicios.map(x=>x.id===s.id?{...x,base:Number(e.target.value)||0}:x)})}/>
            <button onClick={()=>updateCfg({servicios:cfg.servicios.filter(x=>x.id!==s.id)})} className="lav-press text-slate-300 hover:text-rose-500"><Ic p={P.x} size={18}/></button>
          </div>
          <select value={procesoDe(s)} onChange={e=>{ const pr=PROCESOS.find(p=>p.id===e.target.value); updateCfg({servicios:cfg.servicios.map(x=>x.id===s.id?{...x,etapas:pr.etapas}:x)}); }} className="mt-2 w-full rounded-lg border-2 border-slate-200 px-2 py-1.5 text-xs font-semibold outline-none focus:border-blue-500">
            {PROCESOS.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
        </div>))}
        {cfg.servicios.length===0 && <p className="text-sm text-slate-400 font-semibold text-center py-2">Sin servicios. Agrega uno abajo.</p>}
      </div>
      <NuevoServicio onAdd={(s)=>updateCfg({servicios:[...cfg.servicios,s]})}/>
    </Sec>
    <Sec title="Lavadores"><ListEditor items={cfg.lavadores} upd={(v)=>updateCfg({lavadores:v})} ph="Nombre del lavador" val={nl} setVal={setNl}/></Sec>
    <Sec title="Bahías"><ListEditor items={cfg.bahias} upd={(v)=>updateCfg({bahias:v})} ph="Ej: Bahía 4" val={nb} setVal={setNb}/></Sec>
    <Sec title="Claves de acceso">
      <p className="text-xs text-slate-400 mb-3 font-semibold">Cambia tu clave (Dueño) y la del Empleado. Escribe las nuevas y toca "Aceptar cambio".</p>
      <div className="grid grid-cols-2 gap-2">
        <label className="block"><span className="text-xs font-bold text-slate-400">Clave del Dueño</span><input className={inp+" mt-1"} value={cd} onChange={e=>{setCd(e.target.value);setOkClaves(false);}} inputMode="numeric"/></label>
        <label className="block"><span className="text-xs font-bold text-slate-400">Clave del Empleado</span><input className={inp+" mt-1"} value={ce} onChange={e=>{setCe(e.target.value);setOkClaves(false);}} inputMode="numeric"/></label>
      </div>
      <button onClick={guardarClaves} className="lav-press mt-3 w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold py-2.5 rounded-xl">Aceptar cambio</button>
      {okClaves && <p className="text-xs font-extrabold text-emerald-600 mt-2 text-center">✓ Claves actualizadas</p>}
    </Sec>
    <Sec title="Datos bancarios (transferencia)">
      <p className="text-xs text-slate-400 mb-3 font-semibold">Se muestran al cliente cuando el vehículo está listo.</p>
      <div className="grid grid-cols-2 gap-2">
        <label className="block"><span className="text-xs font-bold text-slate-400">Banco</span><input className={inp+" mt-1"} value={b.banco||""} onChange={e=>setB("banco",e.target.value)}/></label>
        <label className="block"><span className="text-xs font-bold text-slate-400">Tipo de cuenta</span><input className={inp+" mt-1"} value={b.tipo||""} onChange={e=>setB("tipo",e.target.value)} placeholder="Ahorros/Corriente"/></label>
        <label className="block col-span-2"><span className="text-xs font-bold text-slate-400">Número de cuenta</span><input className={inp+" mt-1"} value={b.numero||""} onChange={e=>setB("numero",e.target.value)} inputMode="numeric"/></label>
        <label className="block"><span className="text-xs font-bold text-slate-400">Titular</span><input className={inp+" mt-1"} value={b.titular||""} onChange={e=>setB("titular",e.target.value)}/></label>
        <label className="block"><span className="text-xs font-bold text-slate-400">Cédula/RUC</span><input className={inp+" mt-1"} value={b.cedula||""} onChange={e=>setB("cedula",e.target.value)} inputMode="numeric"/></label>
      </div>
    </Sec>
    <Sec title="Redes sociales">
      <p className="text-xs text-slate-400 mb-3 font-semibold">Usuario o enlace. Aparecen como botones en la vista del cliente.</p>
      <div className="space-y-2">
        <label className="block"><span className="text-xs font-bold text-slate-400">Instagram</span><input className={inp+" mt-1"} value={red.instagram||""} onChange={e=>setRed("instagram",e.target.value)} placeholder="@milavadora"/></label>
        <label className="block"><span className="text-xs font-bold text-slate-400">Facebook</span><input className={inp+" mt-1"} value={red.facebook||""} onChange={e=>setRed("facebook",e.target.value)} placeholder="milavadora"/></label>
        <label className="block"><span className="text-xs font-bold text-slate-400">TikTok</span><input className={inp+" mt-1"} value={red.tiktok||""} onChange={e=>setRed("tiktok",e.target.value)} placeholder="@milavadora"/></label>
      </div>
    </Sec>
    <Sec title="Juego / promoción (acertijo)">
      <p className="text-xs text-slate-400 mb-3 font-semibold">El cliente responde en su pantalla de seguimiento; si acierta, gana el % para su próxima lavada.</p>
      <label className="flex items-center gap-2 mb-3 cursor-pointer">
        <input type="checkbox" checked={!!jg.activo} onChange={e=>setJg("activo",e.target.checked)} className="w-5 h-5"/>
        <span className="text-sm font-bold text-slate-600">Activar juego</span>
      </label>
      <div className="space-y-2">
        <label className="block"><span className="text-xs font-bold text-slate-400">Pregunta / acertijo</span><input className={inp+" mt-1"} value={jg.pregunta||""} onChange={e=>setJg("pregunta",e.target.value)} placeholder="Ej: ¿Cuánto es 5 + 3?"/></label>
        <div className="grid grid-cols-2 gap-2">
          <label className="block"><span className="text-xs font-bold text-slate-400">Respuesta correcta</span><input className={inp+" mt-1"} value={jg.respuesta||""} onChange={e=>setJg("respuesta",e.target.value)} placeholder="8"/></label>
          <label className="block"><span className="text-xs font-bold text-slate-400">% de descuento</span><input type="number" className={inp+" mt-1"} value={jg.porcentaje||""} onChange={e=>setJg("porcentaje",Number(e.target.value)||0)} placeholder="10"/></label>
        </div>
        <div className="flex flex-col gap-1.5 mt-1">
          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={jg.pedirSeguir!==false} onChange={e=>setJg("pedirSeguir",e.target.checked)} className="w-4 h-4"/><span className="text-xs font-bold text-slate-600">Pedir captura de <b>seguir</b> la página</span></label>
          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={jg.pedirCompartir!==false} onChange={e=>setJg("pedirCompartir",e.target.checked)} className="w-4 h-4"/><span className="text-xs font-bold text-slate-600">Pedir captura de <b>compartir</b> la página</span></label>
        </div>
      </div>
    </Sec>
    <Sec title="Respaldo / exportar">
      <p className="text-xs text-slate-400 mb-3 font-semibold">Descarga una copia de tus datos.</p>
      <div className="space-y-2">
        <button onClick={()=>descargar(`respaldo-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({clientes,vehiculos,orders,config:cfg},null,2), "application/json")} className="lav-press w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold py-2.5 rounded-xl text-sm">Respaldo completo (JSON)</button>
        <button onClick={()=>descargar(`clientes-${new Date().toISOString().slice(0,10)}.csv`, csv(clientes.map(c=>({nombre:c.nombre,whatsapp:c.whatsapp,visitas:c.visitas}))), "text/csv;charset=utf-8")} className="lav-press w-full bg-blue-50 border-2 border-blue-100 text-blue-700 font-extrabold py-2.5 rounded-xl text-sm">Clientes (CSV)</button>
        <button onClick={()=>descargar(`cobros-${new Date().toISOString().slice(0,10)}.csv`, csv(orders.filter(o=>o.pago?.pagado).map(o=>({fecha:new Date(Number(o.fecha)).toLocaleString('es-EC'),placa:o.placa,cliente:o.cliente,tipo:o.tipo,total:totalOrden(o),metodo:o.pago?.metodo}))), "text/csv;charset=utf-8")} className="lav-press w-full bg-blue-50 border-2 border-blue-100 text-blue-700 font-extrabold py-2.5 rounded-xl text-sm">Cobros (CSV)</button>
      </div>
    </Sec>
    <Sec title="Reiniciar datos (empezar desde cero)">
      <p className="text-xs text-slate-400 mb-3 font-semibold">Borra clientes, vehículos, cobros y gastos. Se conservan tus precios, lavadores y configuración. Requiere tu PIN.</p>
      {!rst ? <button onClick={()=>{setRst(true);setRstOk(false);}} className="lav-press w-full border-2 border-rose-200 text-rose-500 font-extrabold py-2.5 rounded-xl">Reiniciar todo</button> : (
        <div className="space-y-2">
          <input value={rstPin} onChange={e=>{setRstPin(e.target.value);setRstMsg("");}} inputMode="numeric" type="password" placeholder="PIN del propietario" className={inp}/>
          {rstMsg && <p className="text-xs font-bold text-rose-500">{rstMsg}</p>}
          <div className="flex gap-2">
            <button onClick={()=>{setRst(false);setRstPin("");setRstMsg("");}} className="lav-press flex-1 py-2.5 rounded-xl border-2 border-slate-200 font-bold text-slate-500">Cancelar</button>
            <button onClick={doReset} className="lav-press flex-1 py-2.5 rounded-xl bg-rose-500 text-white font-extrabold">Sí, borrar todo</button>
          </div>
        </div>
      )}
      {rstOk && <p className="text-xs font-extrabold text-emerald-600 mt-2 text-center">✓ Datos reiniciados. Empezaste desde cero.</p>}
    </Sec>
  </div>);
}

/* ====== LICENCIA / SUSCRIPCIÓN ====== */
function Aviso({dias,lic,negocio}){
  const wa = lic.contacto?.whatsapp ? `https://wa.me/${waNumber(lic.contacto.whatsapp)}?text=${encodeURIComponent(`Hola, quiero renovar la licencia de ${negocio}.`)}` : null;
  return (<div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 mb-4 flex items-center gap-3">
    <span className="bg-amber-100 text-amber-600 p-2 rounded-xl"><Ic p={P.alert} size={18}/></span>
    <p className="flex-1 text-sm font-bold text-amber-700">Licencia por vencer: quedan {dias} día{dias!==1?"s":""}. Contacta al proveedor para renovar.</p>
    {wa&&<a href={wa} target="_blank" rel="noreferrer" className="lav-press bg-amber-500 text-white text-xs font-extrabold px-3 py-2 rounded-lg shrink-0">Renovar</a>}
  </div>);
}

function Bloqueo({cfg,updateCfg}){
  const lic=cfg.licencia||{};
  const [pin,setPin]=useState(""); const [modo,setModo]=useState(false); const [msg,setMsg]=useState("");
  const dias=lic.dias||15;
  const wa = lic.contacto?.whatsapp ? `https://wa.me/${waNumber(lic.contacto.whatsapp)}?text=${encodeURIComponent(`Hola, quiero renovar la licencia de ${cfg.negocio}.`)}` : null;
  const entrar=()=>{ if(pin===String(lic.pin||"6276")){ setModo(true); setMsg(""); } else setMsg("PIN incorrecto."); };
  const renovar=(d)=>updateCfg({licencia:{...lic, vencimiento: Date.now()+d*86400000}});
  return (<div className="lav-bg min-h-screen flex items-center justify-center p-6">
    <div className="bg-white rounded-3xl shadow-xl border border-slate-100 max-w-sm w-full p-6 text-center">
      <div className="inline-flex bg-rose-100 text-rose-500 p-4 rounded-2xl mb-3"><Ic p={P.alert} size={36}/></div>
      <h1 className="font-extrabold text-xl text-slate-800">Servicio suspendido</h1>
      <p className="text-sm text-slate-500 font-semibold mt-2">El período de uso de <b>{cfg.negocio}</b> ha finalizado. Contacta al proveedor para renovar tu licencia y reactivar la aplicación.</p>
      {wa&&<a href={wa} target="_blank" rel="noreferrer" className="lav-press mt-4 w-full bg-emerald-500 text-white font-extrabold py-3 rounded-xl flex items-center justify-center gap-2"><Ic p={P.msg} size={18}/> Contactar al proveedor</a>}
      {modo===false&&<button onClick={()=>setModo("pin")} className="mt-3 text-xs font-bold text-slate-400 underline">Soy el proveedor</button>}
      {modo==="pin"&&(<div className="mt-4 lav-pop"><input value={pin} onChange={e=>setPin(e.target.value)} inputMode="numeric" placeholder="PIN del proveedor" className="w-full text-center text-lg font-extrabold rounded-xl border-2 border-slate-200 py-2.5 outline-none focus:border-blue-500"/>{msg&&<p className="text-xs font-bold text-rose-500 mt-1">{msg}</p>}<button onClick={entrar} className="lav-press mt-2 w-full bg-blue-600 text-white font-extrabold py-2.5 rounded-xl">Ingresar</button></div>)}
      {modo===true&&(<div className="mt-4 lav-pop"><p className="text-sm font-bold text-slate-600 mb-2">Renovar licencia por:</p><div className="grid grid-cols-3 gap-2">{[15,30,90].map(d=>(<button key={d} onClick={()=>renovar(d)} className="lav-press bg-blue-50 border-2 border-blue-100 text-blue-700 font-extrabold py-2 rounded-xl text-sm">{d} días</button>))}</div><button onClick={()=>renovar(dias)} className="lav-press mt-2 w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold py-2.5 rounded-xl">Renovar {dias} días (predet.)</button></div>)}
    </div>
  </div>);
}

function LicenciaModal({cfg,updateCfg,onClose}){
  const lic=cfg.licencia||{};
  const [open,setOpen]=useState(false); const [pin,setPin]=useState(""); const [msg,setMsg]=useState("");
  const venc=lic.vencimiento||0; const dias=lic.dias||15;
  const rest=Math.ceil((venc-Date.now())/86400000);
  const fecha = venc? new Date(venc).toLocaleDateString('es-EC',{day:'2-digit',month:'2-digit',year:'numeric'}) : "—";
  const entrar=()=>{ if(pin===String(lic.pin||"6276")){ setOpen(true); setMsg(""); } else setMsg("PIN incorrecto."); };
  const setLic=(patch)=>updateCfg({licencia:{...lic,...patch}});
  const inp="w-full rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-semibold outline-none focus:border-blue-500";
  return (<div className="fixed inset-0 z-50 bg-slate-900/40 flex items-end sm:items-center justify-center p-4" onClick={onClose}>
    <div className="bg-white rounded-3xl shadow-xl w-full max-w-sm p-5 lav-pop" onClick={e=>e.stopPropagation()}>
      <div className="flex items-center justify-between mb-3"><h2 className="font-extrabold text-slate-700">Licencia (proveedor)</h2><button onClick={onClose} className="lav-press text-slate-300 hover:text-slate-500"><Ic p={P.x} size={20}/></button></div>
      {!open?(<div><p className="text-xs text-slate-400 font-semibold mb-2">Ingresa el PIN para administrar la licencia.</p><input value={pin} onChange={e=>setPin(e.target.value)} inputMode="numeric" placeholder="PIN" className={inp+" text-center text-lg"} autoFocus/>{msg&&<p className="text-xs font-bold text-rose-500 mt-1">{msg}</p>}<button onClick={entrar} className="lav-press mt-3 w-full bg-blue-600 text-white font-extrabold py-2.5 rounded-xl">Ingresar</button></div>):(
      <div className="space-y-3 lav-pop">
        <p className="text-xs text-slate-400 font-semibold">Vence: <b>{fecha}</b> ({rest>=0?`quedan ${rest} días`:"vencida"}).</p>
        <label className="block"><span className="text-xs font-bold text-slate-400">Duración por defecto (días)</span><input type="number" value={dias} onChange={e=>setLic({dias:Number(e.target.value)||0})} className={inp+" mt-1"}/></label>
        <div className="grid grid-cols-2 gap-2">
          <button onClick={()=>setLic({vencimiento:Date.now()+(dias||15)*86400000})} className="lav-press bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-extrabold py-2.5 rounded-xl text-sm">Renovar +{dias} días</button>
          <button onClick={()=>setLic({vencimiento:Date.now()+30*86400000})} className="lav-press bg-blue-50 border-2 border-blue-100 text-blue-700 font-extrabold py-2.5 rounded-xl text-sm">Renovar 1 mes</button>
        </div>
        <label className="block"><span className="text-xs font-bold text-slate-400">Vencimiento exacto</span><input type="date" value={venc?new Date(venc).toISOString().slice(0,10):""} onChange={e=>{ const d=e.target.value?new Date(e.target.value+"T23:59:59").getTime():venc; setLic({vencimiento:d}); }} className={inp+" mt-1"}/></label>
        <div className="grid grid-cols-2 gap-2">
          <label className="block"><span className="text-xs font-bold text-slate-400">Contacto (nombre)</span><input value={lic.contacto?.nombre||""} onChange={e=>setLic({contacto:{...(lic.contacto||{}),nombre:e.target.value}})} className={inp+" mt-1"}/></label>
          <label className="block"><span className="text-xs font-bold text-slate-400">Contacto WhatsApp</span><input value={lic.contacto?.whatsapp||""} onChange={e=>setLic({contacto:{...(lic.contacto||{}),whatsapp:e.target.value}})} className={inp+" mt-1"} inputMode="tel"/></label>
        </div>
        <label className="block"><span className="text-xs font-bold text-slate-400">Cambiar PIN del proveedor</span><input value={String(lic.pin||"")} onChange={e=>setLic({pin:e.target.value})} className={inp+" mt-1"}/></label>
        <button onClick={()=>setLic({vencimiento:Date.now()-1000})} className="lav-press w-full border-2 border-rose-200 text-rose-500 font-extrabold py-2.5 rounded-xl text-sm">Suspender ahora (probar bloqueo)</button>
      </div>
    )}
    </div>
  </div>);
}

function JuegoCliente({juego, redes, negocio}){
  const [resp,setResp]=useState(""); const [ok,setOk]=useState(false); const [msg,setMsg]=useState("");
  const [followImg,setFollowImg]=useState(null); const [shareImg,setShareImg]=useState(null);
  const pct=Number(juego.porcentaje)||0;
  const pedirSeguir=juego.pedirSeguir!==false; const pedirCompartir=juego.pedirCompartir!==false;
  const r=redes||{};
  const seguirUrl = r.instagram?redUrl("instagram",r.instagram):(r.facebook?redUrl("facebook",r.facebook):(r.tiktok?redUrl("tiktok",r.tiktok):"#"));
  const check=()=>{ const c=resp.trim() && resp.trim().toLowerCase()===String(juego.respuesta||"").trim().toLowerCase(); setOk(c); setMsg(c?"":"Mmm, esa no es. ¡Intenta de nuevo!"); };
  const readImg=(e,set)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>set(rd.result); rd.readAsDataURL(f); };
  const compartir=async()=>{ const d={title:negocio||"Lavadora", text:`¡Lava tu auto en ${negocio||"nuestra lavadora"}!`, url:(seguirUrl!=="#"?seguirUrl:window.location.origin)}; try{ if(navigator.share){ await navigator.share(d); } else { window.open(d.url,"_blank"); } }catch(e){} };
  const listo = ok && (!pedirSeguir||followImg) && (!pedirCompartir||shareImg);
  const fileCls="block w-full text-xs text-slate-500 mt-2 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-600 file:font-bold";
  if(listo) return (<div className="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-5 text-center">
    <div className="inline-flex bg-emerald-500 text-white p-3 rounded-2xl mb-2"><Ic p={P.gift} size={26}/></div>
    <p className="font-extrabold text-emerald-700 text-lg">¡Ganaste {pct}%! 🎉</p>
    <p className="text-sm font-semibold text-slate-600 mt-1">Descuento para tu próxima lavada.</p>
    <p className="text-xs font-bold text-slate-400 mt-2">Muestra esta pantalla al personal.</p>
    <div className="flex gap-2 justify-center mt-3">
      {followImg && <img src={followImg} alt="seguir" className="w-16 h-16 object-cover rounded-lg border-2 border-emerald-200"/>}
      {shareImg && <img src={shareImg} alt="compartir" className="w-16 h-16 object-cover rounded-lg border-2 border-emerald-200"/>}
    </div>
  </div>);
  return (<div className="bg-white rounded-2xl border border-amber-100 shadow-sm p-5 space-y-3">
    <p className="font-extrabold text-slate-700 flex items-center gap-2"><span className="bg-gradient-to-br from-amber-400 to-orange-500 text-white p-1.5 rounded-lg"><Ic p={P.gift} size={16}/></span> ¡Juega y gana {pct}%!</p>
    <div><p className="text-sm text-slate-600 font-semibold">1) {juego.pregunta}</p>
      {!ok ? (<><input value={resp} onChange={e=>{setResp(e.target.value);setMsg("");}} onKeyDown={e=>{if(e.key==="Enter")check();}} placeholder="Tu respuesta" className="mt-2 w-full rounded-xl border-2 border-slate-200 px-3 py-2.5 text-sm font-semibold outline-none focus:border-amber-500"/>
        {msg && <p className="text-xs font-bold text-rose-500 mt-1">{msg}</p>}
        <button onClick={check} className="lav-press mt-2 w-full bg-gradient-to-r from-amber-400 to-orange-500 text-white font-extrabold py-2 rounded-xl text-sm">Comprobar</button></>)
       : <p className="text-xs font-extrabold text-emerald-600 mt-1 flex items-center gap-1"><Ic p={P.ok} size={13}/> ¡Respuesta correcta!</p>}
    </div>
    {ok && pedirSeguir && (<div className="border-t border-slate-100 pt-3"><p className="text-sm text-slate-600 font-semibold">2) Síguenos y sube la captura</p>
      {seguirUrl!=="#" && <a href={seguirUrl} target="_blank" rel="noreferrer" className="lav-press inline-flex items-center gap-1 mt-2 text-xs font-bold text-blue-600 bg-blue-50 border-2 border-blue-100 px-3 py-1.5 rounded-lg"><Ic p={P.instagram} size={13}/> Ir a seguir</a>}
      <input type="file" accept="image/*" onChange={e=>readImg(e,setFollowImg)} className={fileCls}/>
      {followImg && <p className="text-xs font-extrabold text-emerald-600 mt-1 flex items-center gap-1"><Ic p={P.ok} size={13}/> Captura recibida</p>}
    </div>)}
    {ok && pedirCompartir && (<div className="border-t border-slate-100 pt-3"><p className="text-sm text-slate-600 font-semibold">3) Comparte y sube la captura</p>
      <button onClick={compartir} className="lav-press inline-flex items-center gap-1 mt-2 text-xs font-bold text-blue-600 bg-blue-50 border-2 border-blue-100 px-3 py-1.5 rounded-lg"><Ic p={P.msg} size={13}/> Compartir</button>
      <input type="file" accept="image/*" onChange={e=>readImg(e,setShareImg)} className={fileCls}/>
      {shareImg && <p className="text-xs font-extrabold text-emerald-600 mt-1 flex items-center gap-1"><Ic p={P.ok} size={13}/> Captura recibida</p>}
    </div>)}
  </div>);

function EscenaCarro({estado}){
  const drops=estado==="lavado"; const wind=estado==="secado"; const vac=estado==="aspirado";
  const spark=estado==="detallado"||estado==="encerado"; const shine=estado==="detallado"||estado==="encerado"; const done=estado==="listo"||estado==="entregado";
  const info={espera:["En espera 🅿️","Tu vehículo está en cola"],lavado:["Lavando 💧","Enjabonando y enjuagando"],secado:["Secando 💨","Quitando el agua"],aspirado:["Aspirando 🌀","Limpiando el interior"],detallado:["Detallando ✨","Puliendo los detalles"],encerado:["Encerando ✨","Aplicando cera y brillo"],listo:["¡Listo! 🎉","Puedes pasar a retirarlo"],entregado:["Entregado ✓","¡Gracias por tu preferencia!"]}[estado]||["",""];
  return (<div className="relative rounded-2xl overflow-hidden border border-blue-100" style={{height:240,background:"linear-gradient(180deg,#dbeafe 0%,#eff6ff 60%,#f8fafc 100%)"}}>
    <div className="absolute top-4 inset-x-0 text-center px-3">
      <p className="font-extrabold text-blue-700 text-lg leading-tight">{info[0]}</p>
      <p className="text-xs font-semibold text-blue-500">{info[1]}</p>
    </div>
    {drops && [...Array(7)].map((_,i)=>(<span key={i} className="seg-drop" style={{left:(10+i*12)+"%",animationDelay:(i*0.18)+"s"}}/>))}
    {drops && [...Array(6)].map((_,i)=>(<span key={"b"+i} className="seg-bub" style={{left:(15+i*13)+"%",animationDelay:(i*0.3)+"s"}}/>))}
    {wind && [0,1,2,3].map(i=>(<span key={i} className="seg-wind" style={{top:(44+i*11)+"%",animationDelay:(i*0.3)+"s"}}/>))}
    {vac && [...Array(5)].map((_,i)=>(<span key={i} className="seg-spark" style={{left:(26+i*12)+"%",animationDelay:(i*0.28)+"s"}}/>))}
    {spark && [...Array(6)].map((_,i)=>(<span key={i} className="seg-star" style={{left:(16+i*13)+"%",top:(34+((i%3)*13))+"%",animationDelay:(i*0.25)+"s"}}/>))}
    {done && [...Array(10)].map((_,i)=>(<span key={i} className="seg-confetti" style={{left:(8+i*9)+"%",background:["#22d3ee","#3b82f6","#10b981","#f59e0b","#8b5cf6"][i%5],animationDelay:(i*0.12)+"s"}}/>))}
    <div className="absolute inset-x-0 bottom-6 flex justify-center">
      <div className={"relative "+(done?"seg-bob":(wind?"seg-shake":""))}>
        <img src={CAR_IMG} alt="carro" style={{width:200,filter:"drop-shadow(0 10px 12px rgba(37,99,235,.28))"}}/>
        {shine && <span className="seg-shine"/>}
        {done && <span className="absolute -top-2 -right-2 bg-emerald-500 text-white rounded-full p-1.5 shadow"><Ic p={P.check} size={18}/></span>}
      </div>
    </div>
  </div>);
}

function Seguimiento({id}){
  const [order,setOrder]=useState(null); const [cfg,setCfg]=useState({}); const [estado,setEstado]=useState("load");
  useEffect(()=>{
    const cargar=async()=>{
      const [o,cf]=await Promise.all([ SB.from("orders").select("*").eq("id",id).single(), SB.from("config").select("*").eq("id",1).single() ]);
      if(o&&o.data){ setOrder(o.data); setCfg(cf&&cf.data?cf.data:{}); setEstado("ok"); } else setEstado("nf");
    };
    cargar();
    const ch=SB.channel("seg").on("postgres_changes",{event:"*",schema:"public",table:"orders"},cargar).subscribe();
    return ()=>SB.removeChannel(ch);
  },[]);
  if(estado==="load") return <Splash msg="Cargando seguimiento..." />;
  if(estado==="nf") return <Splash err msg="No encontramos este vehículo. Verifica el enlace." />;
  const raw=order.estado; const est=NORM_ESTADO[raw]||raw;
  const entregado=est==="entregado";
  const seq=etapasDeOrden(order,cfg.servicios);
  const pasos=seq.map(sid=>({id:sid,label:(ESTADOS.find(e=>e.id===sid)||{}).label||sid}));
  const idx=entregado?pasos.length:pasos.findIndex(p=>p.id===est);
  const estActual=entregado?"entregado":est;
  const tipo=tipoOf(order.tipo);
  const bt=bancoTexto(cfg.licencia&&cfg.licencia.banco);
  const listo=est==="listo"||entregado;
  return (<div className="lav-bg min-h-screen">
    <header className="lav-header text-white p-5 text-center relative overflow-hidden">
      {[20,50,75].map((l,i)=>(<span key={i} className="lav-bubble" style={{left:l+"%",width:8+i*3,height:8+i*3,animationDelay:i*1.2+"s"}}/>))}
      <div className="relative"><div className="inline-flex bg-white p-1.5 rounded-2xl shadow mb-2 overflow-hidden"><img src={LOGO_IMG} alt="logo" className="w-14 h-14 rounded-xl object-cover block"/></div>
      <h1 className="font-extrabold text-2xl leading-tight">{cfg.negocio||"Lavadora"}</h1>
      <p className="text-cyan-50 text-sm font-semibold">Seguimiento de su vehículo</p></div>
    </header>
    <div className="max-w-md mx-auto p-4 space-y-4">
      <EscenaCarro estado={estActual} />
      <div className="bg-white rounded-2xl border border-blue-50 shadow-sm p-4 flex items-center gap-3">
        <span className={"p-3 rounded-xl "+tipo.tint}><Ic p={tipo.pth} size={26}/></span>
        <div><p className="font-mono font-extrabold text-xl text-slate-800 tracking-wider">{order.placa}</p><p className="text-sm text-slate-400 font-semibold">{[order.marca,order.color].filter(Boolean).join(" · ")||tipo.label}</p></div>
      </div>
      <div className="bg-white rounded-2xl border border-blue-50 shadow-sm p-5">
        <p className="text-xs font-bold text-slate-400 mb-3">Estado actual</p>
        <div className="space-y-3">
          {pasos.map((p,i)=>{ const done=idx>i; const now=idx===i;
            return (<div key={p.id} className="flex items-center gap-3">
              <span className={"w-8 h-8 rounded-full flex items-center justify-center font-extrabold text-sm "+((done||now)?"bg-gradient-to-br from-cyan-500 to-blue-600 text-white":"bg-slate-100 text-slate-400")}>{done?<Ic p={P.check} size={16}/>:i+1}</span>
              <span className={"font-bold "+(now?"text-blue-600":done?"text-slate-600":"text-slate-400")}>{p.label}{now&&!entregado&&" ⏳"}</span>
            </div>); })}
          {entregado&&<div className="flex items-center gap-3"><span className="w-8 h-8 rounded-full flex items-center justify-center bg-emerald-500 text-white"><Ic p={P.check} size={16}/></span><span className="font-bold text-emerald-600">Entregado ✓</span></div>}
        </div>
      </div>
      {listo&&(<div className="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-5 text-center">
        <div className="inline-flex bg-emerald-500 text-white p-3 rounded-2xl mb-2"><Ic p={P.ok} size={26}/></div>
        <p className="font-extrabold text-emerald-700 text-lg">¡Su vehículo está listo!</p>
        {bt&&(<div className="mt-3 text-left bg-white rounded-xl p-3 border border-emerald-100"><p className="text-xs font-bold text-slate-400 mb-1">Pago por transferencia</p><p className="text-sm font-semibold text-slate-700 whitespace-pre-line">{bt}</p></div>)}
      </div>)}
      <p className="text-center text-[11px] text-slate-400 font-bold">Esta página se actualiza sola.</p>
      {(cfg.licencia&&cfg.licencia.juego&&cfg.licencia.juego.activo&&cfg.licencia.juego.pregunta) ? <JuegoCliente juego={cfg.licencia.juego} redes={(cfg.licencia&&cfg.licencia.redes)||{}} negocio={cfg.negocio}/> : null}
      {(()=>{ const red=(cfg.licencia&&cfg.licencia.redes)||{}; if(!(red.instagram||red.facebook||red.tiktok)) return null;
        return (<div className="bg-white rounded-2xl border border-blue-50 shadow-sm p-4">
          <p className="text-xs font-bold text-slate-400 mb-3 text-center">Síguenos en redes</p>
          <div className="flex justify-center gap-4">
            {red.instagram && <a href={redUrl("instagram",red.instagram)} target="_blank" rel="noreferrer" className="lav-press text-white p-3 rounded-2xl shadow" style={{background:"linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)"}}><Ic p={P.instagram} size={24}/></a>}
            {red.facebook && <a href={redUrl("facebook",red.facebook)} target="_blank" rel="noreferrer" className="lav-press text-white p-3 rounded-2xl shadow" style={{background:"#1877f2"}}><Ic p={P.facebook} size={24}/></a>}
            {red.tiktok && <a href={redUrl("tiktok",red.tiktok)} target="_blank" rel="noreferrer" className="lav-press text-white p-3 rounded-2xl shadow" style={{background:"#111827"}}><Ic p={P.tiktok} size={24}/></a>}
          </div>
        </div>);
      })()}
    </div>
  </div>);
}

/* ====== VARIOS ====== */
function Empty({p,title,msg}){ return (<div className="lav-pop bg-white rounded-2xl border border-blue-50 shadow-sm p-10 text-center"><span className="inline-flex bg-blue-50 text-blue-400 p-4 rounded-2xl mb-3"><Ic p={p} size={32}/></span><h3 className="font-extrabold text-slate-700">{title}</h3><p className="text-sm text-slate-400 mt-1 font-semibold">{msg}</p></div>); }
function Splash({msg,err}){ return (<div className="lav-bg min-h-screen flex flex-col items-center justify-center gap-3 p-6 text-center"><div className={"p-4 rounded-2xl "+(err?"bg-rose-100 text-rose-500":"bg-blue-100 text-blue-500")}><Ic p={err?P.alert:P.drop} size={36}/></div><p className={"font-extrabold "+(err?"text-rose-500":"text-slate-500")}>{msg}</p></div>); }
function SplashInicio({negocio}){
  return (<div className="lav-header min-h-screen flex flex-col items-center justify-center text-white relative overflow-hidden">
    {[15,35,55,75,88].map((l,i)=>(<span key={i} className="lav-bubble" style={{left:l+"%",width:10+i*4,height:10+i*4,animationDelay:i*0.7+"s"}}/>))}
    <div className="relative text-center splash-in">
      <div className="inline-flex bg-white p-2 rounded-3xl shadow-lg mb-4 splash-logo overflow-hidden"><img src={LOGO_IMG} alt="logo" className="w-24 h-24 rounded-2xl object-cover block"/></div>
      <h1 className="font-extrabold text-3xl leading-tight px-6">{negocio||"Mi Lavadora"}</h1>
      <p className="text-cyan-50 font-semibold mt-1">Lavado de vehículos</p>
      <div className="flex justify-center gap-1.5 mt-6">
        <span className="w-2.5 h-2.5 rounded-full bg-white/80 splash-dot"/>
        <span className="w-2.5 h-2.5 rounded-full bg-white/80 splash-dot" style={{animationDelay:".2s"}}/>
        <span className="w-2.5 h-2.5 rounded-full bg-white/80 splash-dot" style={{animationDelay:".4s"}}/>
      </div>
    </div>
  </div>);
}

const __seguir = new URLSearchParams(window.location.search).get("seguir");
ReactDOM.createRoot(document.getElementById("root")).render(__seguir ? <Seguimiento id={__seguir} /> : <App/>);
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
